# Build the pkgdown site and publish it to gh-pages, serving at
# https://ppbds.github.io/primer.tutorials/ . Adapted from the tutorials
# half of PPBDS/primer's publish.yaml (this package used to be a subdir
# there, with its site nested under the book's at /primer/tutorials/).
name: pkgdown

on:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for V8
        run: |
          sudo apt-get update
          sudo apt-get install -y libnode-dev libv8-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          cache-version: 1

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            pkg         = ".",
            dest_dir    = "docs",
            new_process = FALSE,
            install     = FALSE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
